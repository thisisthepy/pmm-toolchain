name: Test

# Every pull request and every push to develop runs the plugin's and the CLI's tests,
# each in its own job (AGENTS.md section 8). Results are counted from the JUnit
# XML, not from the log.
#
# Both modules depend on org.thisisthepy.python.multiplatform:packpack:0.1.0 from
# mavenLocal, so each job first publishes it from pypackpack's develop branch.
# usage-example/ is its own build (toolchain#22, #62; python-multiplatform's Kotlin), run by the
# consumer and e2e jobs with this repository's wrapper (../gradlew from usage-example/ = ./gradlew -p usage-example).
on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # Both live in :toolchain (#78): the plugin's `test` and tcl's `cliTest`, run as separate
        # invocations (AGENTS.md section 8).
        include:
          - { name: toolchain, task: test }
          - { name: tcl, task: cliTest }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: thisisthepy/pypackpack
          ref: develop
          path: .ci/pypackpack

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: astral-sh/setup-uv@v6

      - name: Publish packpack to mavenLocal
        working-directory: .ci/pypackpack
        run: ./gradlew :packpack:publishToMavenLocal --console=plain

      - name: Test ${{ matrix.name }}
        run: ./gradlew :toolchain:${{ matrix.task }} --rerun --console=plain

      - name: The plugin's publication carries no tcl
        if: matrix.task == 'test'
        run: |
          ./gradlew :toolchain:jar :toolchain:generatePomFileForPluginMavenPublication --console=plain
          jar=$(ls toolchain/build/libs/toolchain-*.jar | grep -v -- '-sources\|-javadoc' | head -1)
          pom=toolchain/build/publications/pluginMaven/pom-default.xml
          ls -la "$jar" "$pom"
          if unzip -l "$jar" | grep -n "multiplatform/tcl/\|toolchain_lite"; then echo "::error::tcl classes are in the plugin jar (#78)"; exit 1; fi
          if grep -n "<artifactId>tcl\|toolchain-lite\|clikt" "$pom"; then echo "::error::the plugin POM depends on tcl (#78)"; exit 1; fi
          echo "plugin jar and POM carry no tcl"

      - name: Count results
        if: always()
        run: |
          python3 - <<'PY'
          import glob, re
          t = f = e = s = 0
          for x in glob.glob("toolchain/build/test-results/${{ matrix.task }}/*.xml"):
              m = re.search(r'tests="(\d+)" skipped="(\d+)" failures="(\d+)" errors="(\d+)"', open(x).read(4000))
              t += int(m[1]); s += int(m[2]); f += int(m[3]); e += int(m[4])
          print(f"tests={t} skipped={s} failures={f} errors={e}")
          PY

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-test-reports
          path: toolchain/build/reports/tests/${{ matrix.task }}/

  # Unit tests run on Kotlin 2.x's stdlib, but a consumer runs the plugin on the kotlin-stdlib Gradle
  # embeds. pypackpack#31 broke every suspend call that way and no unit test could see it. This job is
  # a real consumer: usage-example (its own build) with a real pip dependency installs, bundles, zips.
  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: thisisthepy/pypackpack
          ref: develop
          path: .ci/pypackpack
      - uses: actions/checkout@v4
        with:
          repository: thisisthepy/python-multiplatform
          ref: develop
          path: .ci/python-multiplatform
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@v6

      # usage-example applies three things from mavenLocal: packpack (through the plugin), the
      # toolchain plugin, and python-multiplatform's library and bindings plugin. Versions pinned in
      # usage-example/gradle/libs.versions.toml (library 3.15.0-alpha01, plugin 3.13.0 until
      # python-multiplatform#70).
      - name: Publish packpack, the toolchain plugin and python-multiplatform to mavenLocal
        run: |
          (cd .ci/pypackpack && ./gradlew :packpack:publishToMavenLocal --console=plain)
          ./gradlew :toolchain:publishToMavenLocal --console=plain
          # Targeted, not publishAllToMavenLocal: that currently fails on the Android release Java
          # resources (generatePythonProperties has no declared consumer; reported to the lead).
          (cd .ci/python-multiplatform && ./gradlew \
            :python-multiplatform:publishDesktopPublicationToMavenLocal \
            :python-multiplatform:publishKotlinMultiplatformPublicationToMavenLocal \
            :python-multiplatform-ksp:publishToMavenLocal --console=plain)
          (cd .ci/python-multiplatform && ./gradlew -p python-multiplatform-gradle-plugin publishToMavenLocal --console=plain)

      - name: Install, bundle and zip as a consumer
        working-directory: usage-example
        run: |
          ../gradlew installPythonDependencies buildPython packagePython \
            --console=plain > consumer.log 2>&1 || { cat consumer.log; exit 1; }
          cat consumer.log
          grep -q "iniconfig" consumer.log || { echo "the dependency was not installed"; exit 1; }
          ls -la build/distributions/
          # #16: the dependency is installed for the host triple and reaches the payload, not only the venv.
          test -f build/pythonDeps/host/iniconfig/__init__.py || { echo "iniconfig was not installed for the host triple"; exit 1; }
          test -f build/pythonBundle/python/iniconfig/__init__.py || { echo "iniconfig is not in the bundle"; exit 1; }
          unzip -l build/distributions/*.zip | grep -q "python/iniconfig/__init__.py" || { echo "iniconfig is not in the zip"; exit 1; }

  # toolchain#22, desktop: the packaged app (createDistributable) runs Python with no PYTHONHOME --
  # python-multiplatform's stdlib from python-multiplatform-home/ (its SPEC L-9, #60) plus this
  # plugin's python/ payload (example_py and the bundled iniconfig). `--python-smoke` exits before
  # the window opens, so this runs headless.
  # Required since python-multiplatform#60 (packaged stdlib, its PR #76) and #74 (real libpython in the
  # packaged home and the jar, its PR #85): the app runs in a scrubbed environment and os.py must be
  # inside it.
  desktop-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: thisisthepy/pypackpack
          ref: develop
          path: .ci/pypackpack
      - uses: actions/checkout@v4
        with:
          repository: thisisthepy/python-multiplatform
          ref: develop
          path: .ci/python-multiplatform
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@v6

      - name: Publish packpack, the toolchain plugin and python-multiplatform to mavenLocal
        run: |
          (cd .ci/pypackpack && ./gradlew :packpack:publishToMavenLocal --console=plain)
          ./gradlew :toolchain:publishToMavenLocal --console=plain
          # Targeted, not publishAllToMavenLocal: that currently fails on the Android release Java
          # resources (generatePythonProperties has no declared consumer; reported to the lead).
          (cd .ci/python-multiplatform && ./gradlew \
            :python-multiplatform:publishDesktopPublicationToMavenLocal \
            :python-multiplatform:publishKotlinMultiplatformPublicationToMavenLocal \
            :python-multiplatform-ksp:publishToMavenLocal --console=plain)
          (cd .ci/python-multiplatform && ./gradlew -p python-multiplatform-gradle-plugin publishToMavenLocal --console=plain)

      - name: Package the desktop app
        working-directory: usage-example
        run: ../gradlew createDistributable --console=plain

      - name: Run the packaged app's Python, headless and without PYTHONHOME
        working-directory: usage-example
        run: |
          set -euo pipefail
          app=$(find build/compose/binaries/main/app -maxdepth 3 -type f -path '*/bin/*' | head -n 1)
          [ -n "$app" ] || { echo "no packaged launcher under build/compose/binaries/main/app"; exit 1; }
          appdir=$(cd "$(dirname "$app")/.." && pwd -P)
          # A scrubbed environment: no PYTHONHOME, and no LD_LIBRARY_PATH / PATH leading to the runner's
          # own CPython (setup-python installs one), so only what the app carries can be used.
          out=$(env -i HOME="$HOME" PATH=/usr/bin:/bin "$app" --python-smoke 2>&1) || { echo "$out"; exit 1; }
          echo "$out"
          printf '%s\n' "$out" | grep -q '^PYTHON_SMOKE_OK ' || { echo "no PYTHON_SMOKE_OK line"; exit 1; }
          stdlib=$(printf '%s\n' "$out" | sed -n 's/^PYTHON_SMOKE_STDLIB //p')
          case "$stdlib" in
            "$appdir"/*) echo "stdlib from the packaged app: $stdlib" ;;
            *) echo "stdlib not from the packaged app ($appdir): '$stdlib'"; exit 1 ;;
          esac

  # toolchain#22, Android: the debug APK on an x86_64 emulator runs Python with the stdlib
  # python-multiplatform ships and unpacks (PythonBootstrap) plus this plugin's assets/python/
  # (example_py and iniconfig installed for x86_64-linux-android). The smoke result goes to logcat.
  # Green since python-multiplatform#72 (PR #75): the emulator logs PYTHON_SMOKE_OK with the stdlib
  # unpacked under /data/data/<app>/files/lib/python3.15/.
  android-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: thisisthepy/pypackpack
          ref: develop
          path: .ci/pypackpack
      - uses: actions/checkout@v4
        with:
          repository: thisisthepy/python-multiplatform
          ref: develop
          path: .ci/python-multiplatform
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - uses: astral-sh/setup-uv@v6

      - name: Publish packpack, the toolchain plugin and python-multiplatform (Android too)
        run: |
          (cd .ci/pypackpack && ./gradlew :packpack:publishToMavenLocal --console=plain)
          ./gradlew :toolchain:publishToMavenLocal --console=plain
          (cd .ci/python-multiplatform && ./gradlew \
            :python-multiplatform:publishAndroidReleasePublicationToMavenLocal \
            :python-multiplatform:publishKotlinMultiplatformPublicationToMavenLocal \
            :python-multiplatform-ksp:publishToMavenLocal --console=plain)
          (cd .ci/python-multiplatform && ./gradlew -p python-multiplatform-gradle-plugin publishToMavenLocal --console=plain)

      - name: Build the debug APK
        working-directory: usage-example
        run: ../gradlew assembleDebug --console=plain

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the installed APK's Python on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            set -eu; apk=$(find usage-example/build/outputs/apk/debug -name '*.apk' | head -n 1); [ -n "$apk" ]; adb install -r "$apk"; adb logcat -c; adb shell am start -W -n org.thisisthepy.python.multiplatform.toolchain.example/.MainActivity --ez python-smoke true; sleep 20; adb logcat -d -s PythonSmoke:V > smoke.log; cat smoke.log; grep -q 'PYTHON_SMOKE_OK ' smoke.log; grep 'PYTHON_SMOKE_OK ' smoke.log | grep -q '/data/'

  guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 docs/guide/check_guide.py
